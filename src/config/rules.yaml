# ============================================================
#  ATURAN ANOMALI — Inventory Control Intelligence Platform
#  ----------------------------------------------------------
#  SPEC ONLY (Task W / dead-code cleanup): file ini adalah SPESIFIKASI
#  deklaratif 23 aturan anomaly — dokumentasi satu-satunya definisi rule.
#  Eksekusi aktual ada di src/lib/queries/rule-evaluation.ts
#  (19 rule via SQL push-down + 3 rule zScore via evaluateHistoricalRulesSql
#  + 1 rule waste zScore via evaluateWasteRulesSql — DEEP-WASTE-1;
#  PERF TAHAP-2/P2-7 moved the zScore rules from JS post-process to SQL).
#  Legacy JS evaluator (src/engine/rules/) dihapus — tidak ada pemanggil
#  produksi sejak migrasi SQL. Saat menambah/mengubah aturan: update file
#  ini (dokumentasi spec) DAN rule-evaluation.ts (implementasi) — keduanya
#  WAJIB sinkron (lihat CONVENTIONS.md §9.2).
#
#  Condition DSL (mirip JSON) — referensi semantik kondisi tiap rule:
#    - Comparison: { field: { op: value } }
#      ops: gt, gte, lt, lte, eq, neq, between, in, is_null, not_null
#    - Logical:  { all: [...] }  /  { any: [...] }
#    - Arithmetic: { mul: [a, b] }, { add: [...] }, { sub: [a, b] }, { div: [a, b] }, { abs: a }
#
#  Field yang tersedia (dari PeriodComparison + InventoryRecord):
#    salesGrowth, bomGrowth, qtyDeviasiGrowth, nominalDeviasiGrowth
#    wasteGrowth, susutGrowth, trialGrowth (BOM correlation — ABS magnitude,
#    dihitung di rule-evaluation CTE dengan div-by-zero guard)
#    deviationToSalesRatio, deviationToBomRatio, benchmarkFlag, zScore
#    qtyDeviasi, nominalDeviasi, qtyWaste, qtySusut, qtyTrial, qtyLossSurplus
#    residualQty, residualRatio, tolerancePct, pctQtyDeviasiToBom
#    direction (LOSS | SURPLUS | NEUTRAL)
#    Derived helpers: absPctQtyDeviasiToBom, absTolerancePct,
#    nominalLossSurplus, absNominalLossSurplus, deviationBomRatio
#    (= qtyDeviasiGrowth / bomGrowth saat bomGrowth > 0),
#    isOverExplained, isDirectionFlip
#
#  Field threshold runtime (dari Settings DB — bisa dipakai sebagai operand):
#    stdDeviasiBomPct, stdSusutPct, stdWastePct, stdTrialPct
#    fallbackTolerancePct, residualLossWarnPct, residualLossHighPct
#    highLossNominalThreshold, historicalZscoreWarn, historicalZscoreHigh
#    salesDeviationFactor, bomDeviationFactor, bomDisproportionateFactor
#    (contoh: { pctQtyDeviasiToBom: { gt: stdDeviasiBomPct } })
#
#  severity: NORMAL | WARNING | ABNORMAL
#  priority: makin tinggi = makin penting (dipakai untuk tie-break)
#
#  ------------------------------------------------------------
#  ATURAN TIE-BREAK TOP-FLAG (BUGHUNT-R1 FIX 12 — dokumentasi)
#  ------------------------------------------------------------
#  Seleksi top-flag per record menggantikan HANYA pada prioritas LEBIH
#  TINGGI (strictly greater); prioritas SAMA mempertahankan flag yang
#  lebih dulu dijumpai. Urutan evaluasi: rule record (RULE_MAP di
#  rule-evaluation.ts) → rule historis (zScore) → rule waste — jadi
#  pada prioritas sama, rule record menang atas historis, historis
#  menang atas waste. Prinsip umum: SPESIFIK mengungguli GENERIK
#  (cf. 4bb2ace DEEP-WASTE-1-B — WASTE_ZERO_BIG_LOSS 81 > HIGH_LOSS_
#  NOMINAL 80, WASTE_RESIDUAL_DOMINANT 76 > RESIDUAL_LOSS_HIGH 75,
#  keduanya dinaikkan justru karena kondisinya subset ketat rule
#  ber-prioritas lebih tinggi sehingga tak pernah bisa top-flag).
#  Konsekuensi wajib saat menambah/mengubah rule: cek prioritas DAN
#  kondisi vs rule lain yang MEMUAT kondisi baru — rule yang firing
#  set-nya subset dari rule ber-prioritas lebih tinggi = rule mati
#  (dievaluasi tapi tak pernah tampil). Contoh terkini (divalidasi
#  silang di /api/settings POST — BUGHUNT-R1 FIX 6): BOM_DEVIATION_
#  DISPROPORTIONATE harus tetap STRICTLY DI BAWAH BOM_DEVIATION_
#  MISMATCH pada prioritas (56 < 88) DAN faktornya harus benar-benar
#  lebih kecil (BOM_DISPROPORTIONATE_FACTOR < BOM_DEVIATION_FACTOR);
#  dispro >= dev membuat firing set-nya subset ketat MISMATCH → rule
#  tidak pernah bisa jadi top-flag.
#  ------------------------------------------------------------
# ============================================================

rules:
  # ===== TERKAIT PENJUALAN =====
  - code: SALES_DEVIATION_MISMATCH
    name: "Pertumbuhan deviasi jauh melebihi pertumbuhan Penjualan"
    category: SALES
    severity: ABNORMAL
    priority: 90
    condition:
      all:
        - salesGrowth: { gt: 0 }
        - nominalDeviasiGrowth: { gt: { mul: [salesGrowth, salesDeviationFactor] } }
    narrative_template: >
      Deviasi meningkat {{nominalDeviasiGrowth}} jauh melebihi pertumbuhan Penjualan {{salesGrowth}}.

  - code: SALES_DEV_DECREASE
    name: "Penjualan turun tapi deviasi naik"
    category: SALES
    severity: ABNORMAL
    priority: 85
    condition:
      all:
        - salesGrowth: { lt: 0 }
        - nominalDeviasiGrowth: { gt: 0 }
    narrative_template: >
      Penjualan turun {{salesGrowth}} namun deviasi naik {{nominalDeviasiGrowth}}.

  # ===== TERKAIT BOM =====
  - code: BOM_DEVIATION_MISMATCH
    name: "Pertumbuhan deviasi jauh melebihi pertumbuhan BOM"
    category: BOM
    severity: ABNORMAL
    priority: 88
    condition:
      all:
        - bomGrowth: { gt: 0 }
        - qtyDeviasiGrowth: { gt: { mul: [bomGrowth, bomDeviationFactor] } }
    narrative_template: >
      QTY BOM meningkat {{bomGrowth}}, namun QTY Deviasi meningkat {{qtyDeviasiGrowth}}.

  - code: BOM_DOWN_DEV_UP
    name: "BOM turun tapi deviasi naik"
    category: BOM
    severity: ABNORMAL
    priority: 82
    condition:
      all:
        - bomGrowth: { lt: 0 }
        - qtyDeviasiGrowth: { gt: 0 }
    narrative_template: >
      QTY BOM turun {{bomGrowth}} namun QTY Deviasi naik {{qtyDeviasiGrowth}}.

  # ===== BOM CORRELATION (Waste/Susut/Trial vs BOM) =====
  - code: WASTE_BOM_MISMATCH
    name: "Waste tidak sejalan dengan BOM"
    category: BOM
    severity: WARNING
    priority: 55
    condition:
      any:
        - all:
            - bomGrowth: { lt: 0 }
            - wasteGrowth: { gt: 0 }
        - all:
            - bomGrowth: { gt: 0 }
            - wasteGrowth: { lt: 0 }
    narrative_template: >
      QTY Waste {{wasteGrowth}} tidak sejalan dengan QTY BOM {{bomGrowth}}. Waste harusnya ikut arah BOM.

  - code: SUSUT_BOM_MISMATCH
    name: "Susut tidak sejalan dengan BOM"
    category: BOM
    severity: WARNING
    priority: 54
    condition:
      any:
        - all:
            - bomGrowth: { lt: 0 }
            - susutGrowth: { gt: 0 }
        - all:
            - bomGrowth: { gt: 0 }
            - susutGrowth: { lt: 0 }
    narrative_template: >
      QTY Susut {{susutGrowth}} tidak sejalan dengan QTY BOM {{bomGrowth}}. Susut harusnya ikut arah BOM.

  - code: TRIAL_BOM_MISMATCH
    name: "Trial tidak sejalan dengan BOM"
    category: BOM
    severity: WARNING
    priority: 53
    condition:
      any:
        - all:
            - bomGrowth: { lt: 0 }
            - trialGrowth: { gt: 0 }
        - all:
            - bomGrowth: { gt: 0 }
            - trialGrowth: { lt: 0 }
    narrative_template: >
      QTY Trial {{trialGrowth}} tidak sejalan dengan QTY BOM {{bomGrowth}}. Trial harusnya ikut arah BOM.

  - code: BOM_DEVIATION_DISPROPORTIONATE
    name: "Deviasi naik tidak proporsional dengan BOM"
    category: BOM
    severity: WARNING
    priority: 56
    condition:
      all:
        - bomGrowth: { gt: 0 }
        - qtyDeviasiGrowth: { gt: 0 }
        - deviationBomRatio: { gt: bomDisproportionateFactor }
    narrative_template: >
      QTY Deviasi naik {{qtyDeviasiGrowth}} tidak proporsional dengan QTY BOM {{bomGrowth}} (rasio {{deviationBomRatio}}×).

  # ===== TOLERANSI =====
  # FIX CALC-2: Use absPctQtyDeviasiToBom + absTolerancePct for magnitude comparison.
  # Excel stores pctQtyDeviasiToBom and tolerancePct as SIGNED values (negative for LOSS).
  # Without ABS, -0.11 > -0.005 is FALSE even though magnitude is larger.
  - code: TOLERANCE_BREACH_HIGH
    name: "Deviasi/BOM melebihi toleransi secara signifikan"
    category: TOLERANCE
    severity: ABNORMAL
    priority: 80
    condition:
      all:
        - tolerancePct: { not_null: true }
        - absPctQtyDeviasiToBom: { gt: { mul: [absTolerancePct, 2] } }
    narrative_template: >
      Deviasi/BOM {{pctQtyDeviasiToBom}} melebihi toleransi {{tolerancePct}} lebih dari 2x.

  - code: TOLERANCE_BREACH
    name: "Deviasi/BOM melebihi toleransi"
    category: TOLERANCE
    severity: WARNING
    priority: 70
    condition:
      all:
        - tolerancePct: { not_null: true }
        - absPctQtyDeviasiToBom: { gt: absTolerancePct }
    narrative_template: >
      Deviasi/BOM {{pctQtyDeviasiToBom}} melebihi toleransi {{tolerancePct}}.

  - code: TOLERANCE_NOT_SET_HIGH_DEV
    name: "Deviasi tinggi namun toleransi belum diset"
    category: TOLERANCE
    severity: WARNING
    priority: 65
    condition:
      all:
        - tolerancePct: { is_null: true }
        - absPctQtyDeviasiToBom: { gt: stdDeviasiBomPct }
    narrative_template: >
      Deviasi/BOM {{pctQtyDeviasiToBom}} tinggi namun toleransi belum diset (flag analitik).

  # ===== OVER_EXPLAINED (Bug 8 fix — red flag fraud) =====
  - code: OVER_EXPLAINED
    name: "Waste+Susut+Trial melebihi total deviasi (indikasi fraud)"
    category: RESIDUAL
    severity: ABNORMAL
    priority: 76
    condition:
      isOverExplained: { eq: true }
    narrative_template: >
      Waste+Susut+Trial ({{qtyWaste}}+{{qtySusut}}+{{qtyTrial}}) melampaui total deviasi ({{qtyDeviasi}}) — indikasi salah input SPV, double-counting, atau fraud.

  # ===== SISA SELISIH =====
  - code: RESIDUAL_LOSS_HIGH
    name: "Sisa selisih LOSS tinggi setelah dikurangi Waste/Susut/Trial"
    category: RESIDUAL
    severity: ABNORMAL
    priority: 75
    condition:
      all:
        # FIX CALC-1: use nominalLossSurplus < 0 (LOSS) instead of stored direction (inverted)
        - nominalLossSurplus: { lt: 0 }
        - residualRatio: { gt: residualLossHighPct }
    narrative_template: >
      Sisa selisih LOSS {{residualRatio}} ({{residualQty}}) tinggi setelah dikurangi Waste/Susut/Trial.

  - code: RESIDUAL_LOSS_WARN
    name: "Sisa selisih LOSS moderat"
    category: RESIDUAL
    severity: WARNING
    priority: 60
    condition:
      all:
        # FIX CALC-1: use nominalLossSurplus < 0 (LOSS) instead of stored direction (inverted)
        - nominalLossSurplus: { lt: 0 }
        - residualRatio: { gt: residualLossWarnPct }
        - residualRatio: { lte: residualLossHighPct }
    narrative_template: >
      Sisa selisih LOSS {{residualRatio}} moderat.

  # ===== DIRECTION (besaran LOSS) =====
  - code: HIGH_LOSS_NOMINAL
    name: "Nominal LOSS tinggi"
    category: DIRECTION
    severity: ABNORMAL
    priority: 80
    condition:
      all:
        # FIX CALC-1: use nominalLossSurplus < 0 (LOSS) instead of stored direction (inverted)
        - nominalLossSurplus: { lt: 0 }
        - absNominalLossSurplus: { gt: highLossNominalThreshold }
    narrative_template: >
      Nominal LOSS {{absNominalLossSurplus}} tinggi.

  # ===== BENCHMARK rules removed in FIX-RULE-CONFIG (CONFIG-05) =====
  # The two legacy BENCHMARK comparison rules (area-tier WARNING +
  # network-tier ABNORMAL) were duplicates of
  # HISTORICAL_WARNING/HISTORICAL_ABNORMAL (same zScore condition).
  # Already removed from SQL (rule-evaluation.ts) + JS post-process in Phase A-2.
  # YAML definitions deleted here to keep config consistent with runtime.

  # ===== DIRECTION FLIP (master context #23 Variance Analysis + #9 Loss/Surplus) =====
  - code: DIRECTION_FLIP
    name: "Arah deviasi berbalik LOSS ↔ SURPLUS antar periode"
    category: HISTORICAL
    severity: WARNING
    priority: 60
    condition:
      isDirectionFlip: { eq: true }
    narrative_template: >
      Arah deviasi berbalik dari {{prevDirection}} → {{direction}} antar periode — indikasi perubahan pola operasional atau error input. Perlu investigasi.

  # ===== HISTORIS =====
  - code: HISTORICAL_ABNORMAL
    name: "Deviasi abnormal vs perilaku historis (arah LOSS)"
    category: HISTORICAL
    severity: ABNORMAL
    priority: 78
    condition:
      all:
        # FIX CALC-1: use nominalLossSurplus < 0 (LOSS) instead of stored direction (inverted)
        - nominalLossSurplus: { lt: 0 }
        - zScore: { gt: historicalZscoreHigh }
    narrative_template: >
      Sangat abnormal: Deviasi/BOM {{zScore}} std-dev di atas rata-rata historis (z > 2.0).

  - code: HISTORICAL_ABNORMAL_SURPLUS
    name: "Deviasi abnormal vs perilaku historis (arah SURPLUS)"
    category: HISTORICAL
    severity: ABNORMAL
    priority: 77
    condition:
      all:
        # FIX CALC-1: use nominalLossSurplus > 0 (SURPLUS) instead of stored direction (inverted)
        - nominalLossSurplus: { gt: 0 }
        - zScore: { gt: historicalZscoreHigh }
    narrative_template: >
      Deviasi/BOM {{zScore}} std-dev di atas rata-rata historis (SURPLUS abnormal).

  - code: HISTORICAL_WARNING
    name: "Deviasi di atas rata-rata historis"
    category: HISTORICAL
    severity: WARNING
    priority: 58
    condition:
      all:
        - zScore: { gt: historicalZscoreWarn }
        - zScore: { lte: historicalZscoreHigh }
    narrative_template: >
      Peringatan: Deviasi/BOM {{zScore}} std-dev di atas rata-rata historis (z > 1.5 — ambang historicalZscoreWarn default).

  # ===== WASTE (DEEP-WASTE-1 — P2 rules dari analisa deep waste offline) =====
  # 4 aturan tambahan (19 → 23). 3 dievaluasi di flags CTE evaluateRulesSql
  # (record grain); WASTE_SPIKE_2SIGMA dievaluasi evaluateWasteRulesSql
  # (zScore vs riwayat waste sendiri — same-weekLabel, sama seperti 3 rule
  # HISTORIS di atas tapi metrik rasio ABS(qtyWaste)/ABS(qtyBom)).
  - code: WASTE_ZERO_BIG_LOSS
    name: "Item rugi besar tapi waste ≈ 0"
    category: WASTE
    severity: ABNORMAL
    # DEEP-WASTE-1-B: 79 → 81 — subset ketat HIGH_LOSS_NOMINAL (80); di 79
    # rule ini tak pernah bisa jadi top-flag (tak terlihat di byRule/byCategory).
    priority: 81
    condition:
      all:
        - absNominalWaste: { lte: 1 }
        - nominalLossSurplus: { lt: -highLossNominalThreshold }
    narrative_template: >
      Item rugi {{absNominalLossSurplus}} tapi waste ≈ 0 — waste tidak (belum) dicatat untuk kerugian sebesar itu.

  - code: WASTE_SALES_UNDER_RECORD
    name: "Waste < 0,1% dari sales pada item LOSS (indikasi under-recording)"
    category: WASTE
    severity: WARNING
    priority: 57
    condition:
      all:
        - nominalSales: { gt: 0 }
        - absNominalWaste: { lt: { mul: [nominalSales, 0.001] } }
        - nominalLossSurplus: { lt: 0 }
    narrative_template: >
      Waste {{absNominalWaste}} hanya < 0,1% dari sales {{nominalSales}} pada item LOSS — indikasi waste kurang tercatat.

  - code: WASTE_RESIDUAL_DOMINANT
    name: "Residual dominan dan waste menjelaskan < 10% dari loss"
    category: WASTE
    # DEEP-WASTE-1-B: 59 → 76 + WARNING → ABNORMAL — subset ketat
    # RESIDUAL_LOSS_HIGH (75/ABNORMAL); di 59 selalu ter-shadow. Naik ke 76
    # agar muncul sebagai top-flag; severity ikut ABNORMAL supaya record yang
    # sebelumnya dihitung abnormal via RESIDUAL_LOSS_HIGH tidak turun kelas.
    severity: ABNORMAL
    priority: 76
    condition:
      all:
        - nominalLossSurplus: { lt: 0 }
        - residualRatio: { gt: residualLossHighPct }
        - absNominalWaste: { lt: { mul: [absNominalLossSurplus, 0.1] } }
    narrative_template: >
      Residual {{residualRatio}} dominan dan waste hanya menjelaskan < 10% dari loss — "waste explains nothing" di item ini.

  - code: WASTE_SPIKE_2SIGMA
    name: "Lonjakan waste > 2σ vs riwayat sendiri"
    category: WASTE
    severity: ABNORMAL
    priority: 74
    condition:
      all:
        - qtyWaste: { not_null: true }
        - zScoreWaste: { gt: historicalZscoreHigh }
    narrative_template: >
      Lonjakan waste: rasio waste/BOM {{zScoreWaste}} std-dev di atas rata-rata historis (z > 2.0) — investigasi kejadian bulan ini.
# ------------------------------------------------------------
#  Catatan field tambahan DEEP-WASTE-1 (Condition DSL):
#    - absNominalWaste = ABS(COALESCE(nominalWaste, 0)) — helper record.
#    - zScoreWaste = (ABS(qtyWaste)/ABS(qtyBom) − mean) / stdDev atas
#      riwayat same-week rasio waste/BOM per (outlet, item) — hanya
#      terdefinisi saat qtyWaste ada, ABS(qtyWaste) > 0, stdDev > 0,
#      n >= historicalMinWeeks (default 4).
# ------------------------------------------------------------
