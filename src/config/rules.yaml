# ============================================================
#  ANOMALY RULES — Inventory Control Intelligence Platform
#  ----------------------------------------------------------
#  Edit/add rules here WITHOUT touching engine code.
#  Engine evaluates each rule against every (outlet, item, week) record.
#
#  Condition DSL (JSON-like):
#    - Comparison: { field: { op: value } }
#      ops: gt, gte, lt, lte, eq, neq, between, in, is_null, not_null
#    - Logical:  { all: [...] }  /  { any: [...] }
#    - Arithmetic: { mul: [a, b] }, { add: [...] }, { sub: [a, b] }, { div: [a, b] }, { abs: a }
#
#  Available fields (from PeriodComparison + InventoryRecord):
#    salesGrowth, bomGrowth, qtyDeviasiGrowth, nominalDeviasiGrowth, priceGrowth
#    deviationToSalesRatio, deviationToBomRatio, benchmarkFlag, zScore
#    qtyDeviasi, nominalDeviasi, qtyWaste, qtySusut, qtyTrial, qtyLossSurplus
#    residualQty, residualRatio, tolerancePct, pctQtyDeviasiToBom
#    direction (LOSS | SURPLUS | NEUTRAL)
#
#  Runtime threshold fields (from Settings DB — can be used as operands):
#    stdDeviasiBomPct, stdSusutPct, stdWastePct, stdTrialPct
#    fallbackTolerancePct, residualLossWarnPct, residualLossHighPct
#    highLossNominalThreshold, historicalZscoreWarn, historicalZscoreHigh
#    salesDeviationFactor, bomDeviationFactor
#    (e.g. { pctQtyDeviasiToBom: { gt: stdDeviasiBomPct } })
#
#  severity: NORMAL | WARNING | ABNORMAL
#  priority: higher = more important (used for tie-break)
# ============================================================

rules:
  # ===== SALES-RELATED =====
  - code: SALES_DEVIATION_MISMATCH
    name: "Deviation growth far exceeds sales growth"
    category: SALES
    severity: ABNORMAL
    priority: 90
    condition:
      all:
        - salesGrowth: { gt: 0 }
        - nominalDeviasiGrowth: { gt: { mul: [salesGrowth, salesDeviationFactor] } }
    narrative_template: >
      Deviasi meningkat {{nominalDeviasiGrowth}} jauh melebihi pertumbuhan Sales {{salesGrowth}}.

  - code: SALES_DEV_DECREASE
    name: "Sales down but deviation up"
    category: SALES
    severity: ABNORMAL
    priority: 85
    condition:
      all:
        - salesGrowth: { lt: 0 }
        - nominalDeviasiGrowth: { gt: 0 }
    narrative_template: >
      Sales turun {{salesGrowth}} namun deviasi naik {{nominalDeviasiGrowth}}.

  # ===== BOM-RELATED =====
  - code: BOM_DEVIATION_MISMATCH
    name: "Deviation growth far exceeds BOM growth"
    category: BOM
    severity: ABNORMAL
    priority: 88
    condition:
      all:
        - bomGrowth: { gt: 0 }
        - qtyDeviasiGrowth: { gt: { mul: [bomGrowth, bomDeviationFactor] } }
    narrative_template: >
      QTY BOM meningkat {{bomGrowth}}, namun QTY deviation meningkat {{qtyDeviasiGrowth}}.

  - code: BOM_DOWN_DEV_UP
    name: "BOM down but deviation up"
    category: BOM
    severity: ABNORMAL
    priority: 82
    condition:
      all:
        - bomGrowth: { lt: 0 }
        - qtyDeviasiGrowth: { gt: 0 }
    narrative_template: >
      QTY BOM turun {{bomGrowth}} namun QTY deviation naik {{qtyDeviasiGrowth}}.

  # ===== TOLERANCE =====
  - code: TOLERANCE_BREACH_HIGH
    name: "Deviation/BOM exceeds tolerance significantly"
    category: TOLERANCE
    severity: ABNORMAL
    priority: 80
    condition:
      all:
        - tolerancePct: { not_null: true }
        - pctQtyDeviasiToBom: { gt: { mul: [tolerancePct, 2] } }
    narrative_template: >
      Deviation/BOM {{pctQtyDeviasiToBom}} melebihi tolerance {{tolerancePct}} lebih dari 2x.

  - code: TOLERANCE_BREACH
    name: "Deviation/BOM exceeds tolerance"
    category: TOLERANCE
    severity: WARNING
    priority: 70
    condition:
      all:
        - tolerancePct: { not_null: true }
        - pctQtyDeviasiToBom: { gt: tolerancePct }
    narrative_template: >
      Deviation/BOM {{pctQtyDeviasiToBom}} melebihi tolerance {{tolerancePct}}.

  - code: TOLERANCE_NOT_SET_HIGH_DEV
    name: "High deviation but no tolerance set"
    category: TOLERANCE
    severity: WARNING
    priority: 65
    condition:
      all:
        - tolerancePct: { is_null: true }
        - pctQtyDeviasiToBom: { gt: stdDeviasiBomPct }
    narrative_template: >
      Deviation/BOM {{pctQtyDeviasiToBom}} tinggi namun tolerance belum diset (analytical flag).

  # ===== OVER_EXPLAINED (Bug 8 fix — fraud red flag) =====
  - code: OVER_EXPLAINED
    name: "Waste+Susut+Trial exceeds total deviation (fraud indicator)"
    category: RESIDUAL
    severity: ABNORMAL
    priority: 76
    condition:
      isOverExplained: { eq: true }
    narrative_template: >
      Waste+Susut+Trial ({{qtyWaste}}+{{qtySusut}}+{{qtyTrial}}) melampaui total deviasi ({{qtyDeviasi}}) — indikasi salah input SPV, double-counting, atau fraud.

  # ===== RESIDUAL =====
  - code: RESIDUAL_LOSS_HIGH
    name: "High residual loss after Waste/Susut/Trial"
    category: RESIDUAL
    severity: ABNORMAL
    priority: 75
    condition:
      all:
        - direction: { eq: "LOSS" }
        - residualRatio: { gt: residualLossHighPct }
    narrative_template: >
      Residual Loss {{residualRatio}} ({{residualQty}}) tinggi setelah dikurangi Waste/Susut/Trial.

  - code: RESIDUAL_LOSS_WARN
    name: "Moderate residual loss"
    category: RESIDUAL
    severity: WARNING
    priority: 60
    condition:
      all:
        - direction: { eq: "LOSS" }
        - residualRatio: { gt: residualLossWarnPct }
        - residualRatio: { lte: residualLossHighPct }
    narrative_template: >
      Residual Loss {{residualRatio}} moderat.

  # ===== DIRECTION (LOSS magnitude) =====
  - code: HIGH_LOSS_NOMINAL
    name: "High nominal loss"
    category: DIRECTION
    severity: WARNING
    priority: 55
    condition:
      all:
        - direction: { eq: "LOSS" }
        - absNominalLossSurplus: { gt: highLossNominalThreshold }
    narrative_template: >
      Nominal loss {{absNominalLossSurplus}} tinggi.

  # ===== BENCHMARK (historical zScore-based, NOT area/network pooled) =====
  # FIX: benchmarkFlag values renamed from ABOVE_AREA_AVG/ABOVE_NETWORK_AVG
  # to HISTORICAL_WARNING/HISTORICAL_HIGH in audit fix. These rules now
  # fire on the correct flag values. Area/network pooled comparison is
  # done separately in computeBenchmark() (benchmark.ts) and outlet-items route.
  - code: BENCHMARK_ABOVE_AREA
    name: "Deviation above historical average (warning level)"
    category: BENCHMARK
    severity: WARNING
    priority: 50
    condition:
      benchmarkFlag: { eq: "HISTORICAL_WARNING" }
    narrative_template: >
      Deviation/BOM outlet di atas historical average (zScore warning).

  - code: BENCHMARK_ABOVE_NETWORK
    name: "Deviation far above historical average (high level)"
    category: BENCHMARK
    severity: ABNORMAL
    priority: 72
    condition:
      benchmarkFlag: { eq: "HISTORICAL_HIGH" }
    narrative_template: >
      Deviation/BOM outlet jauh di atas historical average (zScore high).

  # ===== DIRECTION FLIP (master context #23 Variance Analysis + #9 Loss/Surplus) =====
  - code: DIRECTION_FLIP
    name: "Direction flip LOSS ↔ SURPLUS antar periode"
    category: HISTORICAL
    severity: WARNING
    priority: 60
    condition:
      isDirectionFlip: { eq: true }
    narrative_template: >
      Arah deviasi berbalik dari {{prevDirection}} → {{direction}} antar periode — indikasi perubahan pola operasional atau error input. Perlu investigasi.

  # ===== HISTORICAL =====
  - code: HISTORICAL_ABNORMAL
    name: "Deviation abnormal vs historical behavior (LOSS direction)"
    category: HISTORICAL
    severity: ABNORMAL
    priority: 78
    condition:
      zScore: { gt: historicalZscoreHigh }
    narrative_template: >
      Deviation/BOM {{zScore}} std-dev di atas historical average.

  - code: HISTORICAL_ABNORMAL_SURPLUS
    name: "Deviation abnormal vs historical behavior (SURPLUS direction)"
    category: HISTORICAL
    severity: ABNORMAL
    priority: 77
    condition:
      all:
        - direction: { eq: "SURPLUS" }
        - zScore: { lt: { mul: [-1, historicalZscoreHigh] } }
    narrative_template: >
      Deviation/BOM {{zScore}} std-dev di BAWAH historical average (SURPLUS abnormal).

  - code: HISTORICAL_WARNING
    name: "Deviation above historical average"
    category: HISTORICAL
    severity: WARNING
    priority: 58
    condition:
      all:
        - zScore: { gt: historicalZscoreWarn }
        - zScore: { lte: historicalZscoreHigh }
    narrative_template: >
      Deviation/BOM {{zScore}} std-dev di atas historical average.
