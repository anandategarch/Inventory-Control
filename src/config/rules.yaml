# ============================================================
#  ATURAN ANOMALI — Inventory Control Intelligence Platform
#  ----------------------------------------------------------
#  Edit/tambah aturan di sini tanpa menyentuh kode engine.
#  Engine mengevaluasi setiap aturan terhadap setiap record (outlet, item, week).
#
#  Condition DSL (mirip JSON):
#    - Comparison: { field: { op: value } }
#      ops: gt, gte, lt, lte, eq, neq, between, in, is_null, not_null
#    - Logical:  { all: [...] }  /  { any: [...] }
#    - Arithmetic: { mul: [a, b] }, { add: [...] }, { sub: [a, b] }, { div: [a, b] }, { abs: a }
#
#  Field yang tersedia (dari PeriodComparison + InventoryRecord):
#    salesGrowth, bomGrowth, qtyDeviasiGrowth, nominalDeviasiGrowth
#    deviationToSalesRatio, deviationToBomRatio, benchmarkFlag, zScore
#    qtyDeviasi, nominalDeviasi, qtyWaste, qtySusut, qtyTrial, qtyLossSurplus
#    residualQty, residualRatio, tolerancePct, pctQtyDeviasiToBom
#    direction (LOSS | SURPLUS | NEUTRAL)
#
#  Field threshold runtime (dari Settings DB — bisa dipakai sebagai operand):
#    stdDeviasiBomPct, stdSusutPct, stdWastePct, stdTrialPct
#    fallbackTolerancePct, residualLossWarnPct, residualLossHighPct
#    highLossNominalThreshold, historicalZscoreWarn, historicalZscoreHigh
#    salesDeviationFactor, bomDeviationFactor
#    (contoh: { pctQtyDeviasiToBom: { gt: stdDeviasiBomPct } })
#
#  severity: NORMAL | WARNING | ABNORMAL
#  priority: makin tinggi = makin penting (dipakai untuk tie-break)
# ============================================================

rules:
  # ===== TERKAIT PENJUALAN =====
  - code: SALES_DEVIATION_MISMATCH
    name: "Pertumbuhan deviasi jauh melebihi pertumbuhan Penjualan"
    category: SALES
    severity: ABNORMAL
    priority: 90
    condition:
      all:
        - salesGrowth: { gt: 0 }
        - nominalDeviasiGrowth: { gt: { mul: [salesGrowth, salesDeviationFactor] } }
    narrative_template: >
      Deviasi meningkat {{nominalDeviasiGrowth}} jauh melebihi pertumbuhan Penjualan {{salesGrowth}}.

  - code: SALES_DEV_DECREASE
    name: "Penjualan turun tapi deviasi naik"
    category: SALES
    severity: ABNORMAL
    priority: 85
    condition:
      all:
        - salesGrowth: { lt: 0 }
        - nominalDeviasiGrowth: { gt: 0 }
    narrative_template: >
      Penjualan turun {{salesGrowth}} namun deviasi naik {{nominalDeviasiGrowth}}.

  # ===== TERKAIT BOM =====
  - code: BOM_DEVIATION_MISMATCH
    name: "Pertumbuhan deviasi jauh melebihi pertumbuhan BOM"
    category: BOM
    severity: ABNORMAL
    priority: 88
    condition:
      all:
        - bomGrowth: { gt: 0 }
        - qtyDeviasiGrowth: { gt: { mul: [bomGrowth, bomDeviationFactor] } }
    narrative_template: >
      QTY BOM meningkat {{bomGrowth}}, namun QTY Deviasi meningkat {{qtyDeviasiGrowth}}.

  - code: BOM_DOWN_DEV_UP
    name: "BOM turun tapi deviasi naik"
    category: BOM
    severity: ABNORMAL
    priority: 82
    condition:
      all:
        - bomGrowth: { lt: 0 }
        - qtyDeviasiGrowth: { gt: 0 }
    narrative_template: >
      QTY BOM turun {{bomGrowth}} namun QTY Deviasi naik {{qtyDeviasiGrowth}}.

  # ===== TOLERANSI =====
  # FIX CALC-2: Use absPctQtyDeviasiToBom + absTolerancePct for magnitude comparison.
  # Excel stores pctQtyDeviasiToBom and tolerancePct as SIGNED values (negative for LOSS).
  # Without ABS, -0.11 > -0.005 is FALSE even though magnitude is larger.
  - code: TOLERANCE_BREACH_HIGH
    name: "Deviasi/BOM melebihi toleransi secara signifikan"
    category: TOLERANCE
    severity: ABNORMAL
    priority: 80
    condition:
      all:
        - tolerancePct: { not_null: true }
        - absPctQtyDeviasiToBom: { gt: { mul: [absTolerancePct, 2] } }
    narrative_template: >
      Deviasi/BOM {{pctQtyDeviasiToBom}} melebihi toleransi {{tolerancePct}} lebih dari 2x.

  - code: TOLERANCE_BREACH
    name: "Deviasi/BOM melebihi toleransi"
    category: TOLERANCE
    severity: WARNING
    priority: 70
    condition:
      all:
        - tolerancePct: { not_null: true }
        - absPctQtyDeviasiToBom: { gt: absTolerancePct }
    narrative_template: >
      Deviasi/BOM {{pctQtyDeviasiToBom}} melebihi toleransi {{tolerancePct}}.

  - code: TOLERANCE_NOT_SET_HIGH_DEV
    name: "Deviasi tinggi namun toleransi belum diset"
    category: TOLERANCE
    severity: WARNING
    priority: 65
    condition:
      all:
        - tolerancePct: { is_null: true }
        - absPctQtyDeviasiToBom: { gt: stdDeviasiBomPct }
    narrative_template: >
      Deviasi/BOM {{pctQtyDeviasiToBom}} tinggi namun toleransi belum diset (flag analitik).

  # ===== OVER_EXPLAINED (Bug 8 fix — red flag fraud) =====
  - code: OVER_EXPLAINED
    name: "Waste+Susut+Trial melebihi total deviasi (indikasi fraud)"
    category: RESIDUAL
    severity: ABNORMAL
    priority: 76
    condition:
      isOverExplained: { eq: true }
    narrative_template: >
      Waste+Susut+Trial ({{qtyWaste}}+{{qtySusut}}+{{qtyTrial}}) melampaui total deviasi ({{qtyDeviasi}}) — indikasi salah input SPV, double-counting, atau fraud.

  # ===== SISA SELISIH =====
  - code: RESIDUAL_LOSS_HIGH
    name: "Sisa selisih LOSS tinggi setelah dikurangi Waste/Susut/Trial"
    category: RESIDUAL
    severity: ABNORMAL
    priority: 75
    condition:
      all:
        # FIX CALC-1: use nominalLossSurplus < 0 (LOSS) instead of stored direction (inverted)
        - nominalLossSurplus: { lt: 0 }
        - residualRatio: { gt: residualLossHighPct }
    narrative_template: >
      Sisa selisih LOSS {{residualRatio}} ({{residualQty}}) tinggi setelah dikurangi Waste/Susut/Trial.

  - code: RESIDUAL_LOSS_WARN
    name: "Sisa selisih LOSS moderat"
    category: RESIDUAL
    severity: WARNING
    priority: 60
    condition:
      all:
        # FIX CALC-1: use nominalLossSurplus < 0 (LOSS) instead of stored direction (inverted)
        - nominalLossSurplus: { lt: 0 }
        - residualRatio: { gt: residualLossWarnPct }
        - residualRatio: { lte: residualLossHighPct }
    narrative_template: >
      Sisa selisih LOSS {{residualRatio}} moderat.

  # ===== DIRECTION (besaran LOSS) =====
  - code: HIGH_LOSS_NOMINAL
    name: "Nominal LOSS tinggi"
    category: DIRECTION
    severity: ABNORMAL
    priority: 80
    condition:
      all:
        # FIX CALC-1: use nominalLossSurplus < 0 (LOSS) instead of stored direction (inverted)
        - nominalLossSurplus: { lt: 0 }
        - absNominalLossSurplus: { gt: highLossNominalThreshold }
    narrative_template: >
      Nominal LOSS {{absNominalLossSurplus}} tinggi.

  # ===== BENCHMARK (berbasis zScore historis, BUKAN pooled area/network) =====
  # FIX: nilai benchmarkFlag di-rename dari ABOVE_AREA_AVG/ABOVE_NETWORK_AVG
  # ke HISTORICAL_WARNING/HISTORICAL_HIGH pada audit fix. Aturan ini sekarang
  # fire pada nilai flag yang benar. Perbandingan pooled area/network dilakukan
  # terpisah di computeBenchmark() (benchmark.ts) dan route outlet-items.
  - code: BENCHMARK_ABOVE_AREA
    name: "Deviasi di atas rata-rata historis (level peringatan)"
    category: BENCHMARK
    severity: WARNING
    priority: 50
    condition:
      benchmarkFlag: { eq: "HISTORICAL_WARNING" }
    narrative_template: >
      Deviasi/BOM outlet di atas rata-rata historis (zScore peringatan).

  - code: BENCHMARK_ABOVE_NETWORK
    name: "Deviasi jauh di atas rata-rata historis (level tinggi)"
    category: BENCHMARK
    severity: ABNORMAL
    priority: 72
    condition:
      benchmarkFlag: { eq: "HISTORICAL_HIGH" }
    narrative_template: >
      Deviasi/BOM outlet jauh di atas rata-rata historis (zScore tinggi).

  # ===== DIRECTION FLIP (master context #23 Variance Analysis + #9 Loss/Surplus) =====
  - code: DIRECTION_FLIP
    name: "Arah deviasi berbalik LOSS ↔ SURPLUS antar periode"
    category: HISTORICAL
    severity: WARNING
    priority: 60
    condition:
      isDirectionFlip: { eq: true }
    narrative_template: >
      Arah deviasi berbalik dari {{prevDirection}} → {{direction}} antar periode — indikasi perubahan pola operasional atau error input. Perlu investigasi.

  # ===== HISTORIS =====
  - code: HISTORICAL_ABNORMAL
    name: "Deviasi abnormal vs perilaku historis (arah LOSS)"
    category: HISTORICAL
    severity: ABNORMAL
    priority: 78
    condition:
      all:
        # FIX CALC-1: use nominalLossSurplus < 0 (LOSS) instead of stored direction (inverted)
        - nominalLossSurplus: { lt: 0 }
        - zScore: { gt: historicalZscoreHigh }
    narrative_template: >
      Sangat abnormal: Deviasi/BOM {{zScore}} std-dev di atas rata-rata historis (z > 2.0).

  - code: HISTORICAL_ABNORMAL_SURPLUS
    name: "Deviasi abnormal vs perilaku historis (arah SURPLUS)"
    category: HISTORICAL
    severity: ABNORMAL
    priority: 77
    condition:
      all:
        # FIX CALC-1: use nominalLossSurplus > 0 (SURPLUS) instead of stored direction (inverted)
        - nominalLossSurplus: { gt: 0 }
        - zScore: { gt: historicalZscoreHigh }
    narrative_template: >
      Deviasi/BOM {{zScore}} std-dev di atas rata-rata historis (SURPLUS abnormal).

  - code: HISTORICAL_WARNING
    name: "Deviasi di atas rata-rata historis"
    category: HISTORICAL
    severity: WARNING
    priority: 58
    condition:
      all:
        - zScore: { gt: historicalZscoreWarn }
        - zScore: { lte: historicalZscoreHigh }
    narrative_template: >
      Peringatan: Deviasi/BOM {{zScore}} std-dev di atas rata-rata historis (z > 1.0).
