# Nixpacks configuration for Railway
# Uses Bun for faster builds

[phases.setup]
nixPkgs = ["bun"]

[phases.install]
cmds = ["bun install"]

[phases.build]
# Only generate Prisma Client during build (doesn't need DATABASE_URL)
# db:push runs at startup instead, where DATABASE_URL IS available
cmds = [
  "bunx prisma generate",
  "bun run build"
]

[start]
# Run prisma db push at STARTUP (DATABASE_URL is available at runtime)
# Then start the app
cmd = "bunx prisma db push --accept-data-loss && bun run start"
