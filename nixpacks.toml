# Nixpacks configuration for Railway
# Uses Bun for faster builds

[phases.setup]
nixPkgs = ["bun"]

[phases.install]
cmds = ["bun install"]

[phases.build]
# Set DATABASE_URL fallback in case Railway hasn't set it yet
cmds = [
  "export DATABASE_URL=file:./db/custom.db && bun run db:push",
  "bun run build"
]

[start]
cmd = "bun run start"
