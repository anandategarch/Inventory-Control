# Nixpacks configuration for Railway
# Uses Bun for faster builds

[phases.setup]
nixPkgs = ["bun"]

[phases.install]
cmds = ["bun install"]

[phases.build]
# Set DATABASE_URL inline for each command that needs it
cmds = [
  "DATABASE_URL=file:./db/custom.db bunx prisma generate",
  "mkdir -p db",
  "DATABASE_URL=file:./db/custom.db bunx prisma db push --accept-data-loss",
  "bun run build"
]

[start]
# Set DATABASE_URL inline at startup too
cmd = "mkdir -p db && DATABASE_URL=file:./db/custom.db bunx prisma db push --accept-data-loss && DATABASE_URL=file:./db/custom.db bun run start"
