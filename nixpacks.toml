# Nixpacks configuration for Railway
# Uses Bun for faster builds

[phases.setup]
nixPkgs = ["bun"]

[phases.install]
cmds = ["bun install"]

[phases.build]
# PostgreSQL DATABASE_URL is auto-set by Railway when you add PostgreSQL service
# prisma generate + db push will use it automatically
cmds = [
  "bunx prisma generate",
  "bunx prisma db push --accept-data-loss",
  "bun run build"
]

[start]
cmd = "bun run start"
