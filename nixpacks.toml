# Nixpacks configuration for Railway
# Uses Bun for faster builds

[phases.setup]
nixPkgs = ["bun"]
envs = ["DATABASE_URL=file:./db/custom.db"]

[phases.install]
cmds = ["bun install"]

[phases.build]
# Ensure prisma client is generated, then create DB schema, then build Next.js
cmds = [
  "bunx prisma generate",
  "mkdir -p db",
  "bunx prisma db push --accept-data-loss",
  "bun run build"
]

[start]
# Run db:push again at startup to ensure DB exists, then start
# This handles cases where Railway volume is mounted but DB file is missing
cmd = "mkdir -p db && bunx prisma db push --accept-data-loss && bun run start"
