# Nixpacks configuration for Railway
# Uses Bun for faster builds

[phases.setup]
nixPkgs = ["bun"]
# Set DATABASE_URL as a default env var for the entire build process
# This ensures prisma generate during 'bun install' doesn't fail
envs = ["DATABASE_URL=file:./db/custom.db"]

[phases.install]
cmds = ["bun install"]

[phases.build]
cmds = [
  "bun run db:push",
  "bun run build"
]

[start]
cmd = "bun run start"
